services:
  backend:
    build:
      context: ./backend
    container_name: focusflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the server .env file}
    volumes:
      - ./backend/database.sqlite:/app/database.sqlite

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: focusflow-frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "80:80"
