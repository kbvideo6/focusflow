services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: focusflow-backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-before-production}
      DB_PATH: /app/data/database.sqlite
      TIMETABLE_CSV: /app/EES_2nd_Year_2nd_Semester_Timetable.csv
    volumes:
      - focusflow_db:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: focusflow-frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  focusflow_db:
